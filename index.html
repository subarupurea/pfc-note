<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7A5C">
<title>PFCノート</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky date header, scrolling day sheet, bottom tab bar, full-screen record sheet */
:root{
  --bg:#F3F6F3; --surface:#FFFFFF; --ink:#1C2521; --muted:#66736C; --line:#DCE3DE;
  --accent:#1F7A5C; --accent-ink:#FFFFFF; --soft:#E4EFE9;
  --p:#C8473D; --f:#C98A12; --c:#3A6FB0; --warn:#B4531A; --warn-bg:#FBEDE3;
  --font:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;
  --num:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A211E; --ink:#E6ECE8; --muted:#97A49D; --line:#2B3430;
  --accent:#4CC193; --accent-ink:#0D1F17; --soft:#20302A;
  --p:#E8706A; --f:#E7B44C; --c:#6F9EDB; --warn:#F0A06A; --warn-bg:#33251B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --ink:#E6ECE8; --muted:#97A49D; --line:#2B3430;
  --accent:#4CC193; --accent-ink:#0D1F17; --soft:#20302A;
  --p:#E8706A; --f:#E7B44C; --c:#6F9EDB; --warn:#F0A06A; --warn-bg:#33251B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:12px}
.datebtn{display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
.datelabel{font-weight:700;font-size:17px;min-width:9em;text-align:center}
.appname{font-weight:700;color:var(--accent);letter-spacing:.04em}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:4px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.summary{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:26px;font-weight:700;line-height:1.1}
.bars{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .track{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.dotp{color:var(--p)}.dotf{color:var(--f)}.dotc{color:var(--c)}
.meal h3{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.entry{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.entry:last-child{border-bottom:0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;font-size:18px}
.entry .body{flex:1;min-width:0}
.entry .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .k{font-weight:700;white-space:nowrap}
.pfc{font-size:12px;color:var(--muted)}
.pfc b{font-weight:500}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;height:64px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .add{justify-self:center;width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:28px;flex-direction:row;justify-content:center}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:none;border:1px solid var(--p);color:var(--p)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.4}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet header{position:sticky;top:0;background:var(--bg);z-index:2}
.sheet header .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:12px}
.sheet .content{display:flex;flex-direction:column;gap:14px}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.modes button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.modes button .ic{font-size:20px}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:700}
.photo-prev{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--soft)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick label{border:1.5px dashed var(--line);border-radius:12px;padding:16px 8px;text-align:center;background:var(--surface);font-weight:500}
.pick input{display:none}
.result{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.result .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--soft);font-weight:700}
.tag.openai{color:var(--ink)} .tag.gemini{color:var(--c)}
.item{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.item .top{display:flex;gap:6px}
.item .grid4 input{padding:7px 6px;text-align:right}
.mini{font-size:11px;color:var(--muted);text-align:center}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.food .body{flex:1;min-width:0}
.food .star{font-size:18px;color:var(--f);background:none;border:0;padding:4px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700}
.spinner{width:18px;height:18px;border:2.5px solid var(--soft);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;max-width:90vw}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--num)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:70px;text-align:center}
.sep{height:1px;background:var(--line);margin:4px 0}
details summary{cursor:pointer;font-weight:500}
@media (max-width:380px){.summary{grid-template-columns:1fr;justify-items:center}.bars{width:100%}.modes{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs"><div class="wrap">
  <button data-tab="home"><span class="ic">◎</span>今日</button>
  <button data-tab="weight"><span class="ic">⚖</span>体重</button>
  <button class="add" data-act="open-add" aria-label="食事を記録">＋</button>
  <button data-tab="settings"><span class="ic">⚙</span>設定</button>
</div></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* ---------- storage (IndexedDB key-value) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('pfc-note',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise((res)=>{try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  set(k,v){return new Promise((res)=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
};
const DEFAULT_SETTINGS={openaiKey:'',geminiKey:'',openaiModel:'gpt-5-mini',geminiModel:'gemini-2.5-flash',provider:'openai',handSpan:22,dishes:[{id:'d1',name:'いつもの茶碗',size:'直径12cm'}],theme:''};
const DEFAULT_MIXERS=[
  {id:'m1',name:'牛乳',per100:{kcal:61,p:3.3,f:3.8,c:4.8}},
  {id:'m2',name:'低脂肪乳',per100:{kcal:42,p:3.8,f:1.0,c:5.5}},
  {id:'m3',name:'無調整豆乳',per100:{kcal:44,p:3.6,f:2.8,c:3.1}},
  {id:'m4',name:'水',per100:{kcal:0,p:0,f:0,c:0}}];
const S={profile:null,settings:{...DEFAULT_SETTINGS},entries:[],foods:[],proteins:[],mixers:DEFAULT_MIXERS.slice(),weights:[],stats:{openai:0,gemini:0}};
// 予備コピー: 写真サムネイルを除いた内容を localStorage にも保存し、どちらかが消えても復元できるようにする
const LS='pfc-note:';
function lsGet(k){try{const v=localStorage.getItem(LS+k);return v==null?undefined:JSON.parse(v)}catch(e){return undefined}}
function lsSet(k,v){try{if(k==='entries'||k==='foods')v=v.map(x=>({...x,thumb:''}));localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
async function load(){
  let idbOk=true;try{await DB.open()}catch(e){idbOk=false}
  for(const k of Object.keys(S)){
    let v=idbOk?await DB.get(k):undefined;
    if(v===undefined){v=lsGet(k);if(v!==undefined&&idbOk)DB.set(k,v)}
    if(v!==undefined)S[k]=v;
  }
  S.settings={...DEFAULT_SETTINGS,...S.settings};
}
function save(...keys){keys.forEach(k=>{DB.set(k,S[k]);lsSet(k,S[k])})}
let persisted=null;
async function askPersist(){try{if(navigator.storage?.persist){persisted=await navigator.storage.persisted()||await navigator.storage.persist()}}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(+n||0), r1=n=>Math.round((+n||0)*10)/10;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const WD='日月火水木金土';
function dateLabel(s){const d=parseYmd(s);const t=today();const pre=s===t?'今日 ':s===addDays(t,-1)?'昨日 ':'';return `${pre}${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}
const MEALS=[['breakfast','朝食'],['lunch','昼食'],['dinner','夕食'],['snack','間食']];
// 間食は snack, snack-2, snack-3 … と何回でも増やせる
const snackNo=k=>k==='snack'?1:+(k.split('-')[1]||1);
const isSnack=k=>String(k).startsWith('snack');
const extraSnacks={};// 日付ごとに、まだ記録がない追加分の間食枠
function snackKeys(date){
  const set=new Set(['snack']);
  S.entries.forEach(e=>{if(e.date===date&&isSnack(e.meal))set.add(e.meal)});
  (extraSnacks[date]||[]).forEach(k=>set.add(k));
  return [...set].sort((a,b)=>snackNo(a)-snackNo(b));
}
function mealKeys(date){return ['breakfast','lunch','dinner',...snackKeys(date)]}
function mealName(k,date){
  if(!isSnack(k))return (MEALS.find(m=>m[0]===k)||[,'食事'])[1];
  return snackKeys(date).length>1||snackNo(k)>1?`間食${snackNo(k)}`:'間食';
}
function newSnack(date){const n=Math.max(...snackKeys(date).map(snackNo))+1;const k=`snack-${n}`;(extraSnacks[date]=extraSnacks[date]||[]).push(k);return k}
function mealByTime(){const h=new Date().getHours();return h<10?'breakfast':h<15?'lunch':h<17?'snack':'dinner'}
function sum(list){return list.reduce((a,e)=>({kcal:a.kcal+(+e.kcal||0),p:a.p+(+e.p||0),f:a.f+(+e.f||0),c:a.c+(+e.c||0)}),{kcal:0,p:0,f:0,c:0})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function pfcLine(o){return `<span class="pfc num"><b class="dotp">P</b> ${r1(o.p)} · <b class="dotf">F</b> ${r1(o.f)} · <b class="dotc">C</b> ${r1(o.c)}</span>`}

/* ---------- targets ---------- */
const ACT=[[1.2,'ほぼ座りっぱなし'],[1.375,'軽い運動 週1〜3回'],[1.55,'中程度の運動 週3〜5回'],[1.725,'激しい運動 週6〜7回'],[1.9,'肉体労働＋毎日運動']];
function latestWeight(){if(!S.weights.length)return S.profile?.startWeight;return [...S.weights].sort((a,b)=>a.date<b.date?1:-1)[0].kg}
function computeTargets(p,curW,todayStr){
  if(!p)return null;
  const w=+curW||+p.startWeight, h=+p.height, a=+p.age;
  const bmr=10*w+6.25*h-5*a+(p.sex==='male'?5:-161);
  const tdee=bmr*(+p.activity||1.2);
  const goalDate=addDays(p.startDate,Math.round((+p.months||1)*30.44));
  let days=Math.round((parseYmd(goalDate)-parseYmd(todayStr))/864e5);
  const toGo=w-(+p.targetWeight);
  const warns=[];
  if(days<7){days=7;warns.push('目標日を過ぎているか間近です。設定で期間を延ばしてください。')}
  const daily=toGo*7200/days;
  let kcal=tdee-daily;
  const weekly=toGo/days*7;
  if(weekly>w*0.01)warns.push(`減量ペースが週${r1(weekly)}kgで、体重の1%（${r1(w*0.01)}kg）を超えています。期間を延ばすと筋肉を落としにくくなります。`);
  if(kcal<bmr)warns.push(`目標摂取カロリーが基礎代謝（${r0(bmr)}kcal）を下回っています。体調を崩しやすいので、期間の見直しをおすすめします。`);
  const protein=w*(+p.proteinPerKg||2.0);
  const fat=kcal*(+p.fatPct||25)/100/9;
  let carb=(kcal-protein*4-fat*9)/4;
  if(carb<50)warns.push('炭水化物の枠がとても少なくなっています。目標が厳しすぎる可能性があります。');
  carb=Math.max(carb,0);
  return {bmr,tdee,kcal,protein,fat,carb,days,goalDate,toGo,daily,weekly,warns,w};
}

/* ---------- image ---------- */
async function loadImage(file){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();return img}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function shrink(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function prepPhoto(file){const img=await loadImage(file);return {full:shrink(img,1280,.82),thumb:shrink(img,160,.6)}}

/* ---------- AI ---------- */
function parseJSON(t){t=String(t||'').trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(a>=0?t.slice(a,b+1):t)}
async function callOpenAI(prompt,img){
  const key=S.settings.openaiKey;if(!key)throw new Error('OpenAIのAPIキーが未設定です（設定タブ）');
  const content=[{type:'text',text:prompt}];if(img)content.push({type:'image_url',image_url:{url:img,detail:'high'}});
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:S.settings.openaiModel,messages:[{role:'user',content}],response_format:{type:'json_object'}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(`OpenAI ${r.status}: ${j.error?.message||'エラー'}`);
  return parseJSON(j.choices?.[0]?.message?.content);
}
async function callGemini(prompt,img){
  const key=S.settings.geminiKey;if(!key)throw new Error('GeminiのAPIキーが未設定です（設定タブ）');
  const parts=[{text:prompt}];if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}});
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.geminiModel)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json'}})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(`Gemini ${r.status}: ${j.error?.message||'エラー'}`);
  return parseJSON(j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join(''));
}
const callAI=(prov,prompt,img)=>prov==='gemini'?callGemini(prompt,img):callOpenAI(prompt,img);
function mealPrompt({hand,dish,memo}){
  const hints=[];
  if(hand)hints.push(`写真に、指を大きく広げた手が写っています。親指の先から小指の先までは${S.settings.handSpan}cmです。手は器と同じくらいの高さ・距離にある前提で、これを物差しにして器や料理の大きさを推定してください。`);
  if(dish)hints.push(`写っている器: ${dish}。この寸法も物差しにしてください。`);
  if(memo)hints.push(`利用者のメモ（最優先で考慮）: ${memo}`);
  return `あなたは日本の管理栄養士です。写真の食事に含まれる料理・食品をそれぞれ特定し、量と栄養価を推定してください。
${hints.length?'量を推定する手がかり:\n- '+hints.join('\n- '):'大きさの基準物はありません。一般的な器のサイズから推定してください。'}
日本食品標準成分表の値を参考にし、調理に使った油や調味料も含めてください。家庭料理は一般的なレシピを想定してください。
次のJSONだけを返してください（数値は数値型）:
{"items":[{"name":"料理名","amount":"量の目安（例: 茶碗1杯 約150g）","grams":150,"kcal":0,"p":0,"f":0,"c":0}],"confidence":"high|medium|low","note":"推定の根拠や注意点を1〜2文で"}`;
}

炭水化物が「糖質」と「食物繊維」に分かれている場合は、その合計を c にしてください。

function weightChart(ws,p){
  const goal=addDays(p.startDate,Math.round(p.months*30.44));
  const pts=[{date:p.startDate,kg:+p.startWeight},...ws.filter(w=>w.date>p.startDate)];
  const x0=parseYmd(p.startDate).getTime(), x1=Math.max(parseYmd(goal).getTime(),parseYmd(pts[pts.length-1].date).getTime());
  const all=[...pts.map(q=>+q.kg),+p.targetWeight,+p.startWeight];
  const lo=Math.floor(Math.min(...all)-1), hi=Math.ceil(Math.max(...all)+1);
  const W=320,H=170,L=34,R=10,Tp=10,B=22;
  const X=d=>L+(parseYmd(d).getTime()-x0)/(x1-x0||1)*(W-L-R), Y=k=>Tp+(hi-k)/(hi-lo)*(H-Tp-B);
  const step=Math.max(1,Math.ceil((hi-lo)/4));let grid='';
  for(let k=lo;k<=hi;k+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(k)+3}" text-anchor="end">${k}</text>`;
  const path=pts.map((q,i)=>`${i?'L':'M'}${X(q.date).toFixed(1)},${Y(q.kg).toFixed(1)}`).join('');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="体重の推移">${grid}
    <line x1="${X(p.startDate)}" y1="${Y(p.startWeight)}" x2="${X(goal)}" y2="${Y(p.targetWeight)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${pts.map(q=>`<circle cx="${X(q.date)}" cy="${Y(q.kg)}" r="2.5" fill="var(--ink)"/>`).join('')}
    <circle cx="${X(last.date)}" cy="${Y(last.kg)}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H-6}">${p.startDate.slice(5).replace('-','/')}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${goal.slice(5).replace('-','/')} 目標</text></svg>
    <div class="small muted">点線が目標ペース。実線が記録です。</div>`;
}

  else{
    const g=+pr.g||P?.servingG||0, ml=+pr.ml||0;
    const calc=calcProtein(P,g,M,ml);
    html+=`<div class="card"><label class="f">プロテイン<select id="pr-p">${S.proteins.map(x=>`<option value="${x.id}" ${x.id===pr.pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <div class="grid2" style="margin-top:8px"><label class="f">粉の量 (g)<input id="pr-g" type="number" inputmode="decimal" value="${pr.g||P?.servingG||''}"></label>
      <label class="f">割るもの<select id="pr-m">${S.mixers.map(x=>`<option value="${x.id}" ${x.id===pr.mid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>

      <div class="chips" style="margin-top:8px">${[150,200,250,300].map(x=>`<button class="chip" data-act="ml" data-v="${x}" aria-pressed="${+pr.ml===x}">${x}ml</button>`).join('')}</div>
      <div class="total" style="margin-top:10px"><span class="num">${r0(calc.kcal)} kcal</span>${pfcLine(calc)}</div>
      <div class="row" style="margin-top:10px"><button class="btn grow" data-act="save-protein">記録する</button><button class="btn ghost" data-act="fav-protein">★ いつもの登録</button></div></div>`;
  }
  html+=`<details class="card" ${S.proteins.length?'':'open'}><summary>プロテインを追加する</summary>
    <div class="content" style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      <label class="btn ghost" style="text-align:center">🏷 成分表示を撮って読み取る<input type="file" accept="image/*" capture="environment" data-act="prot-label" hidden></label>
      ${a.busy?'<div class="small"><span class="spinner"></span> 読み取り中…</div>':''}
      <label class="f">名前<input id="np-name" placeholder="例: ザバス ホエイ ココア"></label>
      <label class="f">1食分 (g)<input id="np-g" type="number" inputmode="decimal" placeholder="例: 21"></label>
      <div class="grid4">${['kcal','p','f','c'].map(k=>`<label class="f">${k==='kcal'?'kcal':k.toUpperCase()+' (g)'}<input id="np-${k}" type="number" inputmode="decimal" step="0.1"></label>`).join('')}</div>
      <p class="small muted" style="margin:0">上の4つは「1食分」当たりの値を入れてください。</p>
      <button class="btn" data-act="add-protein">登録する</button>
      ${S.proteins.length?`<div class="list">${S.proteins.map(x=>`<div class="food"><span class="body">${esc(x.name)} <span class="small muted num">${x.servingG}g: ${r0(x.per.kcal)}kcal P${r1(x.per.p)}</span></span><button class="iconbtn" data-act="del-protein" data-id="${x.id}" aria-label="削除">×</button></div>`).join('')}</div>`:''}
    </div></details>
    <details class="card"><summary>割るものを追加する</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      <label class="f">名前<input id="nm-name" placeholder="例: オーツミルク"></label>
      <div class="grid4">${['kcal','p','f','c'].map(k=>`<label class="f">${k==='kcal'?'kcal':k.toUpperCase()}<input id="nm-${k}" type="number" inputmode="decimal" step="0.1"></label>`).join('')}</div>
      <p class="small muted" style="margin:0">100ml当たりの値を入れてください。</p><button class="btn ghost" data-act="add-mixer">追加</button></div></details>`;
  return html;
}
function manualHits(q){q=String(q||'').trim();if(!q)return '';return S.foods.filter(f=>f.name.includes(q)).slice(0,6).map(f=>`<button class="chip" data-act="use-food" data-id="${f.id}">${esc(f.name)} <span class="muted num">${r0(f.kcal)}</span></button>`).join('')}
function calcProtein(P,g,M,ml){
  const k=P?g/P.servingG:0, m=M?ml/100:0;
  const o={};for(const x of ['kcal','p','f','c'])o[x]=(P?P.per[x]*k:0)+(M?M.per100[x]*m:0);return o;
}
function renderRepeat(){
  const a=UI.add;
  return `<input id="r-q" placeholder="過去の記録から探す" value="${esc(a.q)}">
    <div class="row"><span class="small muted">数量</span>${[0.5,1,1.5,2].map(x=>`<button class="chip" data-act="rmult" data-v="${x}" aria-pressed="${UI.repeatMult===x}">×${x}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost grow" data-act="copy-yday" data-meal="${a.meal}">↻ 前日の${mealName(a.meal,addDays(a.date,-1))}をまるごとコピー</button></div>
    <div id="r-lists" style="display:flex;flex-direction:column;gap:14px">${repeatLists()}</div>`;
}
function repeatLists(){
  const a=UI.add,q=a.q.trim();
  let foods=S.foods.filter(f=>!q||f.name.includes(q));
  const favs=foods.filter(f=>f.fav).sort((x,y)=>y.uses-x.uses);
  const freq=foods.filter(f=>!f.fav).sort((x,y)=>(y.uses-x.uses)||(y.lastUsed>x.lastUsed?1:-1)).slice(0,40);
  const row=f=>`<div class="food"><button class="food" style="border:0;padding:0" data-act="repeat" data-id="${f.id}">${f.thumb?`<img class="thumb" src="${f.thumb}" alt="">`:'<span class="thumb">🍽</span>'}<span class="body"><span class="name" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>${pfcLine(f)}</span><b class="num">${r0(f.kcal)}</b></button><button class="star" data-act="fav" data-id="${f.id}" aria-label="お気に入り">${f.fav?'★':'☆'}</button></div>`;
  return `<div class="card"><h2>★ お気に入り</h2>${favs.length?`<div class="list">${favs.map(row).join('')}</div>`:'<div class="empty">☆を押すとここに並びます</div>'}</div>
    <div class="card"><h2>よく食べるもの</h2>${freq.length?`<div class="list">${freq.map(row).join('')}</div>`:'<div class="empty">記録するとここに並びます</div>'}</div>`;
}

/* ---------- saving ---------- */
function upsertFood(e){
  let f=S.foods.find(x=>x.name===e.name&&x.amount===e.amount&&r0(x.kcal)===r0(e.kcal));
  if(f){f.uses++;f.lastUsed=Date.now();if(e.thumb&&!f.thumb)f.thumb=e.thumb}
  else{f={id:uid(),name:e.name,amount:e.amount||'',kcal:e.kcal,p:e.p,f:e.f,c:e.c,thumb:e.thumb||'',fav:false,uses:1,lastUsed:Date.now()};S.foods.push(f)}
  return f;
}
function addEntries(items,source,extra={}){
  const a=UI.add;
  for(const it of items){const e={id:uid(),date:a.date,meal:a.meal,name:it.name,amount:it.amount||'',kcal:r0(it.kcal),p:r1(it.p),f:r1(it.f),c:r1(it.c),source,thumb:it.thumb||extra.thumb||'',provider:extra.provider||'',createdAt:Date.now()};S.entries.push(e);upsertFood(e)}
  save('entries','foods');
  UI.date=a.date;
  toast(`${items.length}件を記録しました`);
}
function copyYesterday(meal,date){
  const y=addDays(date,-1);const src=S.entries.filter(e=>e.date===y&&e.meal===meal);
  const name=mealName(meal,y);
  if(!src.length){toast(`前日の${name}の記録がありません`);return false}
  for(const e of src)S.entries.push({...e,id:uid(),date,createdAt:Date.now(),source:'repeat'});
  save('entries');toast(`前日の${name}を${src.length}件コピーしました`);return true;
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){UI.tab=t.dataset.tab;if(!$('#sheet').hidden)closeSheet();render();window.scrollTo(0,0);return}
  const act=t.dataset.act,a=UI.add;
  switch(act){
    case 'day':UI.date=addDays(UI.date,+t.dataset.n);if(UI.date>today())UI.date=today();render();break;
    case 'open-add':openAdd(t.dataset.meal);break;
    case 'new-snack':openAdd(newSnack(UI.date));break;
    case 'sheet-new-snack':syncAddInputs();a.meal=newSnack(a.date);renderAdd();break;
    case 'close':closeSheet();break;
    case 'meal':a.meal=t.dataset.v;renderAdd();break;
    case 'mode':syncAddInputs();a.mode=t.dataset.v;a.results=null;a.photo=null;a.note='';renderAdd();break;
    case 'prov':a.prov=t.dataset.v;renderAdd();break;
    case 'toggle-hand':syncAddInputs();a.hand=!a.hand;renderAdd();break;
    case 'dish':syncAddInputs();a.dish=a.dish===t.dataset.v?'':t.dataset.v;renderAdd();break;
    case 'clear-photo':a.photo=null;a.results=null;renderAdd();break;
    case 'analyze':syncAddInputs();analyze();break;
    case 'mult':{syncAddInputs();a.results[+t.dataset.ri].mult=+t.dataset.v;renderAdd();break}
    case 'del-item':{syncAddInputs();a.results[+t.dataset.ri].items.splice(+t.dataset.ii,1);renderAdd();break}
    case 'adopt':{
      syncResultEdits();const r=a.results[+t.dataset.ri];const m=r.mult;
      if(!r.items.length){toast('品目がありません');break}
      const items=r.items.map(it=>({...it,amount:m===1?it.amount:`${it.amount} ×${m}`,kcal:it.kcal*m,p:it.p*m,f:it.f*m,c:it.c*m}));
      if(a.results.length>1){S.stats[r.prov]++;save('stats')}
      addEntries(items,a.mode==='label'?'label':'photo',{thumb:a.photo?.thumb,provider:r.prov});closeSheet();break}
    case 'use-food':{const f=S.foods.find(x=>x.id===t.dataset.id);Object.assign(a.manual,{name:f.name,amount:f.amount,kcal:f.kcal,p:f.p,f:f.f,c:f.c});renderAdd();break}
    case 'ai-text':syncAddInputs();aiText();break;
    case 'save-manual':{syncAddInputs();const m=a.manual;if(!m.name.trim()){toast('名前を入れてください');break}
      addEntries([{name:m.name.trim(),amount:m.amount,kcal:+m.kcal||0,p:+m.p||0,f:+m.f||0,c:+m.c||0}],'manual');closeSheet();break}
    case 'ml':syncAddInputs();a.prot.ml=+t.dataset.v;renderAdd();break;
    case 'save-protein':case 'fav-protein':{
      syncAddInputs();const P=S.proteins.find(x=>x.id===a.prot.pid),M=S.mixers.find(x=>x.id===a.prot.mid);
      const g=+a.prot.g||P.servingG,ml=+a.prot.ml||0;const c=calcProtein(P,g,M,ml);
      const item={name:`${P.name} ${g}g＋${M.name} ${ml}ml`,amount:'',...c};
      if(act==='save-protein'){addEntries([item],'protein');closeSheet()}
      else{const f=upsertFood({...item,kcal:r0(c.kcal),p:r1(c.p),f:r1(c.f),c:r1(c.c)});f.uses--;f.fav=true;save('foods');toast('お気に入りに登録しました（リピートから使えます）')}
      break}
    case 'add-protein':{
      const n=$('#np-name').value.trim(),g=+$('#np-g').value;
      if(!n||!g){toast('名前と1食分のgを入れてください');break}
      const P={id:uid(),name:n,servingG:g,per:{kcal:+$('#np-kcal').value||0,p:+$('#np-p').value||0,f:+$('#np-f').value||0,c:+$('#np-c').value||0}};
      S.proteins.push(P);save('proteins');a.prot.pid=P.id;a.prot.g='';toast('プロテインを登録しました');renderAdd();break}
    case 'del-protein':S.proteins=S.proteins.filter(x=>x.id!==t.dataset.id);save('proteins');a.prot.pid=S.proteins[0]?.id||'';renderAdd();break;
    case 'add-mixer':{const n=$('#nm-name').value.trim();if(!n){toast('名前を入れてください');break}
      const M={id:uid(),name:n,per100:{kcal:+$('#nm-kcal').value||0,p:+$('#nm-p').value||0,f:+$('#nm-f').value||0,c:+$('#nm-c').value||0}};
      S.mixers.push(M);save('mixers');a.prot.mid=M.id;toast('追加しました');renderAdd();break}
    case 'rmult':UI.repeatMult=+t.dataset.v;renderAdd();break;
    case 'repeat':{const f=S.foods.find(x=>x.id===t.dataset.id);const m=UI.repeatMult;
      addEntries([{...f,amount:m===1?f.amount:`${f.amount} ×${m}`.trim(),kcal:f.kcal*m,p:f.p*m,f:f.f*m,c:f.c*m}],'repeat');break}
    case 'fav':{const f=S.foods.find(x=>x.id===t.dataset.id);f.fav=!f.fav;save('foods');if(t.dataset.from==='edit')openEdit(t.dataset.eid);else renderAdd();break}
    case 'copy-yday':{const date=a?a.date:UI.date;if(copyYesterday(t.dataset.meal,date)&&a)closeSheet();else render();break}
    case 'edit':openEdit(t.dataset.id);break;
    case 'save-edit':{const e=S.entries.find(x=>x.id===t.dataset.id);
      Object.assign(e,{name:$('#e-name').value,amount:$('#e-amount').value,kcal:r0($('#e-kcal').value),p:r1($('#e-p').value),f:r1($('#e-f').value),c:r1($('#e-c').value),meal:$('#e-meal').value,date:$('#e-date').value||e.date});
      if(e.meal==='__new'){e.meal='';e.meal=newSnack(e.date)}
      save('entries');toast('保存しました');closeSheet();break}
    case 'ask-del':$('#del-zone').innerHTML=`<span class="small">本当に削除しますか？</span><button class="btn danger" data-act="del-entry" data-id="${t.dataset.id}">削除する</button><button class="btn line" data-act="close">やめる</button>`;break;
    case 'del-entry':S.entries=S.entries.filter(x=>x.id!==t.dataset.id);save('entries');toast('削除しました');closeSheet();break;
    case 'save-weight':{const kg=r1($('#w-in').value);if(!kg){toast('体重を入れてください');break}
      S.weights=S.weights.filter(w=>w.date!==today());S.weights.push({date:today(),kg});save('weights');toast('記録しました。目標を再計算しました');render();break}
    case 'del-weight':S.weights=S.weights.filter(w=>w.date!==t.dataset.date);save('weights');render();break;
    case 'save-profile':{

      if(!p.age||!p.height||!p.startWeight||!p.targetWeight||!p.months){toast('年齢・身長・体重・目標・期間をすべて入れてください');break}

      toast('保存しました');render();break}
    case 'save-ai':Object.assign(S.settings,{openaiKey:$('#s-ok').value.trim(),openaiModel:$('#s-om').value.trim()||DEFAULT_SETTINGS.openaiModel,geminiKey:$('#s-gk').value.trim(),geminiModel:$('#s-gm').value.trim()||DEFAULT_SETTINGS.geminiModel,provider:$('#s-prov').value});save('settings');toast('保存しました');render();break;
    case 'save-hand':S.settings.handSpan=+$('#s-hand').value||22;save('settings');toast('保存しました');break;
    case 'add-dish':{const n=$('#d-name').value.trim(),s=$('#d-size').value.trim();if(!n||!s){toast('名前と寸法を入れてください');break}
      S.settings.dishes.push({id:uid(),name:n,size:s});save('settings');render();break}
    case 'del-dish':S.settings.dishes=S.settings.dishes.filter(d=>d.id!==t.dataset.id);save('settings');render();break;
    case 'export':{const withKeys=$('#exp-keys')?.checked;const data=JSON.stringify(withKeys?S:{...S,settings:{...S.settings,openaiKey:'',geminiKey:''}});
      const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const l=document.createElement('a');l.href=url;l.download=`pfc-note-${today()}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(withKeys?'書き出しました（APIキーを含みます）':'書き出しました（APIキーは含みません）');break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='s-ok'||t.id==='s-gk'){const k=t.id==='s-ok'?'openaiKey':'geminiKey';S.settings[k]=t.value.trim();save('settings');const st=$(t.id==='s-ok'?'#ks-ok':'#ks-gk');if(st)st.innerHTML=keyStatus(S.settings[k])}
  if(t.id==='m-name'&&UI.add){UI.add.manual.name=t.value;const h=$('#m-hits');if(h)h.innerHTML=manualHits(t.value)}
  if(t.id==='r-q'&&UI.add){UI.add.q=t.value;const l=$('#r-lists');if(l)l.innerHTML=repeatLists()}
});
document.addEventListener('change',async ev=>{
  const t=ev.target,a=UI.add;
  if(t.dataset.act==='pick-photo'&&t.files[0]){syncAddInputs();try{a.photo=await prepPhoto(t.files[0]);a.results=null;renderAdd()}catch(e){toast('写真を読み込めませんでした')}}
  if(t.dataset.act==='prot-label'&&t.files[0])protLabel(t.files[0]);
  if(t.id==='a-date'&&a)a.date=t.value||a.date;
  if(a&&['pr-p','pr-m','pr-g','pr-ml'].includes(t.id)){syncAddInputs();if(t.id==='pr-p')a.prot.g='';renderAdd()}
  if(t.id==='s-theme'){S.settings.theme=t.value;save('settings');applyTheme()}
  if(t.id==='imp'&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());for(const k of Object.keys(S))if(d[k]!==undefined&&k!=='settings')S[k]=d[k];if(d.settings)S.settings={...S.settings,...d.settings,openaiKey:d.settings.openaiKey||S.settings.openaiKey,geminiKey:d.settings.geminiKey||S.settings.geminiKey};Object.keys(S).forEach(k=>save(k));toast('読み込みました');render()}catch(e){toast('ファイルを読み込めませんでした')}}
});
function syncAddInputs(){
  const a=UI.add;if(!a)return;
  const v=id=>{const el=$(id);return el?el.value:undefined};
  if(v('#a-memo')!==undefined)a.memo=v('#a-memo');
  if(a.mode==='manual')for(const k of ['name','amount','kcal','p','f','c'])if(v('#m-'+k)!==undefined)a.manual[k]=v('#m-'+k);
  if(a.mode==='protein'){if(v('#pr-p')!==undefined)a.prot.pid=v('#pr-p');if(v('#pr-m')!==undefined)a.prot.mid=v('#pr-m');if(v('#pr-g')!==undefined)a.prot.g=v('#pr-g');if(v('#pr-ml')!==undefined)a.prot.ml=v('#pr-ml')}
  syncResultEdits();
}
function syncResultEdits(){
  const a=UI.add;if(!a?.results)return;
  document.querySelectorAll('[data-edit]').forEach(el=>{const [ri,ii,k]=el.dataset.edit.split('.');const it=a.results[ri]?.items[ii];if(it)it[k]=(k==='name'||k==='amount')?el.value:(+el.value||0)});
}

/* ---------- AI flows ---------- */
async function analyze(){
  const a=UI.add;if(!a.photo)return;
  const provs=a.prov==='both'?['openai','gemini']:[a.prov];
  a.busy=true;a.results=null;renderAdd();
  const isMeal=a.mode==='photo';
  const prompt=isMeal?mealPrompt({hand:a.hand,dish:a.dish,memo:a.memo}):LABEL_PROMPT;
  a.results=await Promise.all(provs.map(async prov=>{
    try{const j=await callAI(prov,prompt,a.photo.full);
      if(isMeal)return {prov,items:(j.items||[]).map(normItem),note:j.note||'',confidence:j.confidence||'',mult:1};
      return {prov,items:[normItem({name:j.name||'商品',amount:(j.basis||'').replace(/当たり|あたり/,''),kcal:j.kcal,p:j.p,f:j.f,c:j.c})],basis:j.basis?`表示: ${j.basis}`:'',note:j.note||'',mult:1};
    }catch(e){return {prov,error:e.message||String(e)}}
  }));
  a.busy=false;if(UI.add===a)renderAdd();
}
async function aiText(){
  const a=UI.add,m=a.manual;if(!m.name.trim()){toast('名前を入れてください');return}
  const prov=a.prov==='both'?'openai':a.prov;
  a.busy=true;renderAdd();
  try{const j=await callAI(prov,textPrompt(m.name,m.amount));Object.assign(m,{amount:m.amount||j.amount||'',kcal:r0(j.kcal),p:r1(j.p),f:r1(j.f),c:r1(j.c)});a.note=`${prov==='openai'?'OpenAI':'Gemini'}の推定: ${j.note||''}`}
  catch(e){a.note=e.message}
  a.busy=false;if(UI.add===a)renderAdd();
}
async function protLabel(file){
  const a=UI.add;const prov=a.prov==='both'?'openai':a.prov;
  a.busy=true;renderAdd();
  try{const ph=await prepPhoto(file);const j=await callAI(prov,LABEL_PROMPT,ph.full);a.busy=false;renderAdd();
    const det=document.querySelectorAll('details.card')[0];if(det)det.open=true;
    $('#np-name').value=j.name||'';$('#np-g').value=j.basis_g||'';['kcal','p','f','c'].forEach(k=>$('#np-'+k).value=j[k]??'');
    toast(`読み取りました（${j.basis||'表示単位を確認'}）。内容を確認して登録してください`)}
  catch(e){a.busy=false;renderAdd();toast(e.message)}
}

/* ---------- boot ---------- */
function applyTheme(){const t=S.settings.theme;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
// LINEなどのアプリ内ブラウザは保存領域がChromeと別になるため、外部ブラウザで開き直す
(function(){const ua=navigator.userAgent;
  if(/ Line\//i.test(ua)&&!/openExternalBrowser=1/.test(location.search)){const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');location.replace(u.toString())}
})();
const IN_APP=/ Line\/|FBAN|FBAV|Instagram|; wv\)/i.test(navigator.userAgent);
(async()=>{
  try{await load()}catch(e){toast('保存領域を開けませんでした。データは保存されません')}
  await askPersist();
  applyTheme();
  if(!S.profile)UI.tab='settings';
  render();
  if(IN_APP){const b=document.createElement('div');b.className='warn';b.style.cssText='position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:50';b.innerHTML='アプリ内ブラウザで開いています。ここで入力した内容はChromeやホーム画面のアプリとは別に保存されます。右上のメニューから「ブラウザで開く」を選んでください。';document.body.appendChild(b)}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
